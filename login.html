<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ATPS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --navy: #1E293B;
      --gold: #2563EB;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --border: rgba(37,99,235,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #DBEAFE 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
      text-align: center;
    }
    .logo-text {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 1.5px;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 4px;
      margin-bottom: 30px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      color: var(--navy);
    }
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--navy);
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    .input-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--gold), #1D4ED8);
      color: #fff;
      transition: all 0.3s;
      box-shadow: 0 6px 20px rgba(37,99,235,0.25);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37,99,235,0.35);
    }
    .error-msg {
      color: #EF4444;
      background: rgba(239,68,68,0.1);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      display: none;
    }
    .error-msg.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-text">ATPS</div>
    <div class="logo-sub">Administration</div>
    <div class="title">Secure Login</div>
    <div class="error-msg" id="errorMsg"></div>
    <form action="/login" method="POST">
      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter admin password" required autofocus>
      </div>
      <button type="submit" class="btn"><i class="bi bi-box-arrow-in-right"></i> Login</button>
    </form>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('err') === '1') {
      const errEl = document.getElementById('errorMsg');
      errEl.textContent = 'Incorrect password. Please try again.';
      errEl.classList.add('visible');
    }
  </script>
</body>
</html>
